# Register a Cortex App at: https://www.emotiv.com/my-account/ → Cortex Apps
# This is a DASHBOARD step — can be done before the headset arrives.
emotiv:
  client_id: "H2JRJnsLnhb3Jx6f8xXUQM6yJZWFAYjFf4eLZiEw"
  client_secret: "70TbSpeDrIQlpqRC5pTApbKP426XJby2AEG5QS1W7gDcG4fAWWk2eScf3QfCyKSekMMkzT9uOj3KIkuiMaCTcQkOMGIDiq2zin7MpoDxc8IjoSBybrApyEQnZbjc6Xmc"
  websocket_url: "wss://localhost:6868"  # Local Cortex service — confirmed running
  # Verified addresses (from netstat):
  #   IPv4: wss://127.0.0.1:6868
  #   IPv6: wss://[::1]:6868
  #   State: LISTENING on 0.0.0.0:6868 and [::]:6868
  #   Active connection: [::1]:62467 → [::1]:6868 (Emotiv Launcher ↔ Cortex)
  app_name: "BrainBot"

# EEG / Brainwave settings
eeg:
  sampling_rate: 128          # Hz (128 or 256 supported)
  channels: 14                # EPOC X has 14 channels
  buffer_size: 512            # samples per processing window
  mental_command_sensitivity: 0.5  # 0.0-1.0
  filter_low: 1.0             # Hz (high-pass)
  filter_high: 40.0           # Hz (low-pass)
  notch_filter: 60.0          # Hz (power line noise)

# License requirements
# Basic (free with EPOC X): com, met (0.1 Hz), fac, mot, sys
# Premium (paid): raw EEG, high-res met (2 Hz)
license:
  level: "basic"              # Set to "premium" if you have a paid license
  raw_eeg_available: false    # Requires premium license

# Mood detection settings
mood:
  window_seconds: 3.0         # analysis window for mood classification
  alpha_band: [8.0, 12.0]     # Hz - relaxation / focus
  beta_band: [13.0, 30.0]     # Hz - active thinking / concentration
  theta_band: [4.0, 7.0]      # Hz - drowsiness / meditation
  gamma_band: [30.0, 100.0]   # Hz - peak concentration

# Temi robot settings
# NOTE: Temi SDK is native Android. You need an Android app running on the robot
# that exposes an HTTP/WebSocket API. The real SDK methods are:
#   goTo, skidJoy, turnBy, tiltBy, speak, stopMovement
# Build custom sequences from these primitives.
temi:
  robot_ip: "192.168.1.100"   # Replace with your Temi's IP address
  port: 80
  base_url: "http://192.168.1.100:80"
  command_timeout: 5000        # ms
  safety:
    max_speed_ms: 0.3          # m/s — slow for open house crowds
    enable_e_stop: true
    stop_on_signal_loss: true
    signal_loss_timeout: 3000  # ms

# Interaction flow
interaction:
  calibration_time: 30.0       # seconds for baseline mental command training
  feedback_interval: 2.0       # seconds between feedback to user
  max_attempts: 5              # max mental command attempts before reset
  use_fac_fallback: true       # Use facial expressions if mental commands fail
  consent_required: true       # Visitor must consent before recording
  dance_sequence:
    - "turn_left"
    - "turn_right"
    - "move_forward"
    - "say_hello"
    - "dance"